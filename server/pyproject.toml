[project]
name = "obsidian-server"
version = "2026.09.12.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "mangum>=0.17,<0.18",
    "authlib>=1.3,<1.4",
    "boto3>=1.35,<1.36",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.22",
    "uv-sort>=0.7.1",
    "uvicorn[standard]>=0.32,<0.33",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]
